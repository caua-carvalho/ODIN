# Odin always-on: keep this laptop running as a 24/7 server.
#
# Install to /etc/systemd/logind.conf.d/ and restart systemd-logind (or reboot):
#
#   sudo install -Dm644 ~/odin/deploy/logind-odin-always-on.conf \
#       /etc/systemd/logind.conf.d/90-odin-always-on.conf
#   sudo systemctl restart systemd-logind
#
# Effect: closing the lid does NOT suspend and the power key does NOT power
# off, so the Odin backend keeps serving. A *long* press of the power button
# still forces a real hardware poweroff (HandlePowerKeyLongPress default), so
# the machine can still be turned off when needed.
#
# Note: this only covers the lid switch and the power/suspend/hibernate keys.
# An explicit `systemctl suspend` is NOT blocked by logind — that is why the
# 15-min suspend listener was removed from ~/.config/hypr/hypridle.conf as well.

[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandlePowerKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
